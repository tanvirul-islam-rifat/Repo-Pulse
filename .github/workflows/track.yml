name: Track Repo Stats

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Decide whether today picks this slot
        id: decide
        run: python scripts/should_run.py >> "$GITHUB_OUTPUT"
        env:
          CRON_SCHEDULE: ${{ github.event.schedule }}

      - name: Fetch stats
        if: steps.decide.outputs.run == 'true'
        run: python scripts/track_repos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit data if it changed
        if: steps.decide.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Log repo stats: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push